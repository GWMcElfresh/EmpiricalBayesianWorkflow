name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 8am UTC
    - cron: '0 8 * * 1'

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}


    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::devtools
            any::roxygen2
            stan-dev/cmdstanr
          pak-version: devel
          needs: check
        env:
          R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install cmdstan (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          Rscript -e "if (!requireNamespace('cmdstanr', quietly = TRUE)) { \
            install.packages('cmdstanr', repos = c('https://mc-stan.org/r-packages/', getOption('repos'))); \
          }"
          Rscript -e "cmdstanr::check_cmdstan_toolchain(fix = TRUE)"
          Rscript -e "cmdstanr::install_cmdstan(cores = 2, quiet = TRUE)"

      - name: Document package
        run: |
          Rscript -e "roxygen2::roxygenise()"

      - name: Check package
        run: |
          Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), error_on = 'warning', check_dir = 'check')"

      - name: Test coverage
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          Rscript -e "if (requireNamespace('covr', quietly = TRUE)) covr::codecov(token = '${{ secrets.CODECOV_TOKEN }}')"

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check
